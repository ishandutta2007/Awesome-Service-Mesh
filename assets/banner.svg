<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="300" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#080e1a" />
    </linearGradient>

    <linearGradient id="primaryTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowLineGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="glowLineGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#ec4899" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.1" />
    </linearGradient>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- CSS Keyframe Animations -->
    <style>
      @keyframes dashMove {
        from { stroke-dashoffset: 200; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.85; transform: scale(1.08); }
      }
      @keyframes packetFlow {
        0% { offset-distance: 0%; opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { offset-distance: 100%; opacity: 0; }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes scanline {
        0% { transform: translateY(-50px); }
        100% { transform: translateY(350px); }
      }

      .flow-path-1 {
        stroke-dasharray: 8 12;
        animation: dashMove 4s linear infinite;
      }
      .flow-path-2 {
        stroke-dasharray: 6 10;
        animation: dashMove 3s linear infinite reverse;
      }
      .pulse-node {
        transform-origin: center;
        animation: pulseGlow 3.5s ease-in-out infinite;
      }
      .floating-pill {
        animation: floatSlow 4s ease-in-out infinite;
      }
      .floating-pill-alt {
        animation: floatSlow 5s ease-in-out infinite reverse;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />

  <!-- Subtle Cyber Tech Grid Pattern -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="50" x2="1200" y2="50" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="250" x2="1200" y2="250" />
    <line x1="150" y1="0" x2="150" y2="300" />
    <line x1="300" y1="0" x2="300" y2="300" />
    <line x1="450" y1="0" x2="450" y2="300" />
    <line x1="600" y1="0" x2="600" y2="300" />
    <line x1="750" y1="0" x2="750" y2="300" />
    <line x1="900" y1="0" x2="900" y2="300" />
    <line x1="1050" y1="0" x2="1050" y2="300" />
  </g>

  <!-- Mesh Network Animated Paths & Dynamic Traffic Flow (BACKGROUND LAYER) -->
  <g opacity="0.45">
    <!-- Top Curved Traffic Flow -->
    <path d="M 50 70 Q 300 20, 600 70 T 1150 70" fill="none" stroke="url(#glowLineGrad1)" stroke-width="2.5" class="flow-path-1" />
    <!-- Center Curved Traffic Flow -->
    <path d="M 50 160 Q 350 220, 650 160 T 1150 180" fill="none" stroke="url(#glowLineGrad2)" stroke-width="2" class="flow-path-2" />
    <!-- Cross Mesh Interconnects -->
    <path d="M 120 240 Q 300 120, 600 240 T 1080 120" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" class="flow-path-1" />
  </g>

  <!-- Animated Mesh Nodes / Proxies (Background Accents) -->
  <g>
    <!-- Left Ingress Node -->
    <circle cx="100" cy="80" r="14" fill="#0284c7" opacity="0.25" class="pulse-node" />
    <circle cx="100" cy="80" r="5" fill="#38bdf8" filter="url(#subtleGlow)" />
    <!-- Mid Top Proxy Node -->
    <circle cx="600" cy="65" r="16" fill="#6366f1" opacity="0.2" class="pulse-node" />
    <circle cx="600" cy="65" r="5" fill="#818cf8" filter="url(#subtleGlow)" />
    <!-- Right Egress Node -->
    <circle cx="1100" cy="85" r="14" fill="#ec4899" opacity="0.25" class="pulse-node" />
    <circle cx="1100" cy="85" r="5" fill="#f43f5e" filter="url(#subtleGlow)" />
    <!-- Lower Left Node -->
    <circle cx="140" cy="235" r="12" fill="#06b6d4" opacity="0.2" class="pulse-node" />
    <circle cx="140" cy="235" r="4" fill="#22d3ee" />
    <!-- Lower Right Node -->
    <circle cx="1060" cy="235" r="12" fill="#a855f7" opacity="0.2" class="pulse-node" />
    <circle cx="1060" cy="235" r="4" fill="#c084fc" />
  </g>

  <!-- Dynamic Pill Badges in Background / Middle Ground -->
  <g class="floating-pill" opacity="0.85">
    <rect x="75" y="25" width="130" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
    <text x="140" y="42" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">⚡ L4/L7 PROXIES</text>
  </g>

  <g class="floating-pill-alt" opacity="0.85">
    <rect x="995" y="25" width="130" height="26" rx="13" fill="#1e293b" stroke="#818cf8" stroke-width="1" stroke-opacity="0.4" />
    <text x="1060" y="42" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">🔒 mTLS &amp; ZERO TRUST</text>
  </g>

  <g class="floating-pill-alt" opacity="0.85">
    <rect x="90" y="248" width="145" height="26" rx="13" fill="#1e293b" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.4" />
    <text x="162" y="265" fill="#67e8f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">🌐 SERVICE DISCOVERY</text>
  </g>

  <g class="floating-pill" opacity="0.85">
    <rect x="970" y="248" width="155" height="26" rx="13" fill="#1e293b" stroke="#c084fc" stroke-width="1" stroke-opacity="0.4" />
    <text x="1047" y="265" fill="#d8b4fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">🚀 eBPF &amp; ENVOY MESH</text>
  </g>

  <!-- FOREGROUND LAYER: CRISP, SOLID, PROMINENT TYPOGRAPHY -->
  <g text-anchor="middle">
    <!-- Category Pill -->
    <rect x="490" y="45" width="220" height="28" rx="14" fill="#0f172a" stroke="#6366f1" stroke-width="1.5" />
    <text x="600" y="64" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">⚡ CLOUD-NATIVE NETWORKING</text>

    <!-- Main Title -->
    <text x="600" y="132" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">
      Awesome Service Mesh
    </text>
    
    <!-- Title Highlight Layer -->
    <text x="600" y="172" fill="url(#primaryTextGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" letter-spacing="0.2">
      &amp; Service Proxies Ecosystem
    </text>

    <!-- Subtitle -->
    <text x="600" y="210" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" letter-spacing="0.2">
      Curated Index of L4/L7 Load Balancers, Ingress Controllers, API Gateways &amp; Traffic Planes
    </text>

    <!-- Feature Checklist / Metrics -->
    <text x="600" y="238" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="500">
      ✦ Open-Source &amp; Enterprise SaaS ✦ Architecture Benchmarks ✦ Production Evaluated ✦ Real-Time Insights
    </text>
  </g>

  <!-- Elegant Bottom Border Accent Line -->
  <rect x="0" y="296" width="1200" height="4" fill="url(#primaryTextGrad)" />
</svg>
